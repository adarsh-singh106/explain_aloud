<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 740" width="100%" height="100%" style="background:#f6f8fa; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="panel-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Side Panel Container Frame -->
  <rect x="20" y="20" width="420" height="700" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" filter="url(#panel-shadow)"/>

  <!-- Panel Header Bar -->
  <g transform="translate(36, 40)">
    <!-- Brand -->
    <path d="M 0 11 L 4 7 L 8 7 L 12 11 L 12 21 L 8 25 L 4 25 L 0 21 Z" fill="#0969da"/>
    <path d="M 14 10 Q 18 16 14 22" stroke="#0969da" stroke-width="2" fill="none"/>
    <path d="M 18 7 Q 24 16 18 25" stroke="#0969da" stroke-width="2" fill="none"/>
    <text x="30" y="21" fill="#24292f" font-size="17" font-weight="700">Explain Aloud</text>

    <!-- Status Pill: Online -->
    <rect x="250" y="4" width="138" height="24" rx="12" fill="#dafbe1"/>
    <circle cx="262" cy="16" r="4" fill="#1a7f37"/>
    <text x="272" y="20" fill="#1a7f37" font-size="11" font-weight="700">Gemma 4 (E4B) Ready</text>
  </g>
  <line x1="20" y1="80" x2="440" y2="80" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Mode Toggle Switcher -->
  <g transform="translate(36, 96)">
    <rect x="0" y="0" width="388" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <!-- Natural Mode (Active) -->
    <rect x="2" y="2" width="190" height="30" rx="4" fill="#ffffff" stroke="#e1e4e8" stroke-width="0.5"/>
    <text x="97" y="21" fill="#24292f" font-size="12" font-weight="700" text-anchor="middle">Natural Mode</text>
    <!-- Literal Mode (Inactive) -->
    <text x="290" y="21" fill="#57606a" font-size="12" font-weight="600" text-anchor="middle">Literal Mode</text>
  </g>

  <!-- Source & Block Info Bar -->
  <g transform="translate(36, 144)">
    <rect x="0" y="0" width="388" height="28" rx="5" fill="#f6f8fa" stroke="#e1e4e8" stroke-width="1"/>
    <text x="12" y="18" fill="#57606a" font-size="11">Source: <tspan fill="#24292f" font-weight="600">turn-msg-4821</tspan></text>
    <text x="376" y="18" fill="#0969da" font-size="11" font-weight="600" text-anchor="end">5 blocks extracted</text>
  </g>

  <!-- Active Playback Panel -->
  <g transform="translate(36, 186)">
    <rect x="0" y="0" width="388" height="176" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    
    <!-- Controls Row -->
    <g transform="translate(12, 12)">
      <!-- Pause Button (Active) -->
      <rect x="0" y="0" width="112" height="32" rx="6" fill="#bf8700"/>
      <text x="56" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">⏸ Pause</text>

      <!-- Skip Button -->
      <rect x="126" y="0" width="112" height="32" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="182" y="20" fill="#24292f" font-size="12" font-weight="600" text-anchor="middle">⏭ Skip</text>

      <!-- Cancel Button -->
      <rect x="252" y="0" width="112" height="32" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="308" y="20" fill="#cf222e" font-size="12" font-weight="600" text-anchor="middle">⏹ Cancel</text>
    </g>

    <!-- Playback Meta Info -->
    <g transform="translate(14, 62)">
      <text x="0" y="0" fill="#57606a" font-size="11">State: <tspan fill="#0969da" font-weight="700">PLAYING</tspan></text>
      <text x="360" y="0" fill="#57606a" font-size="11" text-anchor="end">Segment 3 of 5</text>
    </g>

    <!-- Active Segment Card -->
    <g transform="translate(12, 74)">
      <rect x="0" y="0" width="364" height="90" rx="6" fill="#ffffff" stroke="#58a6ff" stroke-width="1.5"/>
      <rect x="8" y="8" width="40" height="18" rx="9" fill="#ddf4ff"/>
      <text x="28" y="21" fill="#0969da" font-size="10" font-weight="700" text-anchor="middle">LLM</text>

      <rect x="54" y="8" width="68" height="18" rx="9" fill="#dafbe1"/>
      <text x="88" y="21" fill="#1a7f37" font-size="10" font-weight="700" text-anchor="middle">✓ Verified</text>

      <text x="354" y="21" fill="#8c959f" font-size="10" text-anchor="end">Block: code-4</text>

      <text x="10" y="44" fill="#24292f" font-size="12" font-style="italic" line-height="16">
        <tspan x="10" dy="0">"This Python snippet iterates through each user and</tspan>
        <tspan x="10" dy="16">sends an email if the user is currently active."</tspan>
      </text>
    </g>
  </g>

  <!-- Narration Plan Segments Inspector -->
  <g transform="translate(36, 380)">
    <text x="0" y="0" fill="#24292f" font-size="13" font-weight="700">Narration Plan Segments</text>
    <text x="388" y="0" fill="#57606a" font-size="11" text-anchor="end">5 verified • 0 fallback</text>

    <!-- Segment 1: Heading -->
    <g transform="translate(0, 12)">
      <rect x="0" y="0" width="388" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="12" y="18" fill="#8c959f" font-size="11" font-weight="600">#1</text>
      <rect x="32" y="8" width="42" height="15" rx="7.5" fill="#dafbe1"/>
      <text x="53" y="19" fill="#1a7f37" font-size="9" font-weight="700" text-anchor="middle">RULE</text>
      <text x="376" y="18" fill="#8c959f" font-size="10" text-anchor="end">Block: h2-1</text>
      <text x="12" y="38" fill="#24292f" font-size="11.5">"Choosing a model."</text>
    </g>

    <!-- Segment 2: Prose -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="388" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="12" y="18" fill="#8c959f" font-size="11" font-weight="600">#2</text>
      <rect x="32" y="8" width="42" height="15" rx="7.5" fill="#dafbe1"/>
      <text x="53" y="19" fill="#1a7f37" font-size="9" font-weight="700" text-anchor="middle">RULE</text>
      <text x="376" y="18" fill="#8c959f" font-size="10" text-anchor="end">Block: p-2</text>
      <text x="12" y="38" fill="#24292f" font-size="11.5">"Suppose we need to choose between accuracy and latency..."</text>
    </g>

    <!-- Segment 3: Active LLM Code Explanation -->
    <g transform="translate(0, 132)">
      <rect x="0" y="0" width="388" height="66" rx="6" fill="#f0f7ff" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="12" y="18" fill="#0969da" font-size="11" font-weight="700">#3 PLAYING</text>
      <rect x="80" y="8" width="36" height="15" rx="7.5" fill="#ddf4ff"/>
      <text x="98" y="19" fill="#0969da" font-size="9" font-weight="700" text-anchor="middle">LLM</text>
      <text x="376" y="18" fill="#0969da" font-size="10" text-anchor="end">Block: code-4</text>
      <text x="12" y="36" fill="#1f2328" font-size="11" font-style="italic">
        <tspan x="12" dy="0">"This Python snippet iterates through each user and</tspan>
        <tspan x="12" dy="15">sends an email if the user is currently active."</tspan>
      </text>
    </g>

    <!-- Segment 4: Table Semantic Comparison -->
    <g transform="translate(0, 206)">
      <rect x="0" y="0" width="388" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="12" y="18" fill="#8c959f" font-size="11" font-weight="600">#4</text>
      <rect x="32" y="8" width="42" height="15" rx="7.5" fill="#dafbe1"/>
      <text x="53" y="19" fill="#1a7f37" font-size="9" font-weight="700" text-anchor="middle">RULE</text>
      <text x="376" y="18" fill="#8c959f" font-size="10" text-anchor="end">Block: table-5</text>
      <text x="12" y="36" fill="#24292f" font-size="11">
        <tspan x="12" dy="0">"The table compares 3 models across Accuracy and Latency.</tspan>
        <tspan x="12" dy="15">For accuracy, Model A is highest at 92%, Model B lowest 88%.</tspan>
        <tspan x="12" dy="15">For latency, Model B is lowest at 1 sec, Model A highest 4 sec."</tspan>
      </text>
    </g>
  </g>
</svg>
