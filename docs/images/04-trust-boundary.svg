<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f85149"/>
    </marker>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Banner Principle -->
  <rect x="180" y="18" width="400" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="380" y="40" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">
    <tspan fill="#7ee787">Truth first.</tspan>  <tspan fill="#58a6ff">Explanation second.</tspan>  <tspan fill="#d2a8ff">Voice third.</tspan>
  </text>

  <!-- Node 1: Source Facts -->
  <g transform="translate(260, 72)" filter="url(#box-shadow)">
    <rect x="0" y="0" width="240" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="120" y="21" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">SOURCE FACTS</text>
    <text x="120" y="34" fill="#8b949e" font-size="10.5" text-anchor="middle">Raw Table Cells • Code Snippets • Prose</text>
  </g>

  <!-- Down Arrow 1 -->
  <line x1="380" y1="114" x2="380" y2="136" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Node 2: Deterministic Extraction -->
  <g transform="translate(230, 136)" filter="url(#box-shadow)">
    <rect x="0" y="0" width="300" height="46" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="150" y="22" fill="#7ee787" font-size="13" font-weight="700" text-anchor="middle">Deterministic Fact Extraction</text>
    <text x="150" y="37" fill="#8b949e" font-size="10.5" text-anchor="middle">Unit Normalization • Extrema Ranking • Entity Bindings</text>
  </g>

  <!-- Down Arrow 2 -->
  <line x1="380" y1="182" x2="380" y2="204" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Node 3: Gemma Chooses Phrasing -->
  <g transform="translate(220, 204)" filter="url(#box-shadow)">
    <rect x="0" y="0" width="320" height="50" rx="6" fill="#1c2128" stroke="#1f6feb" stroke-width="1.8"/>
    <text x="160" y="23" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">Local Gemma 4 via Ollama</text>
    <text x="160" y="39" fill="#c9d1d9" font-size="11" text-anchor="middle">Formulates listening-oriented explanatory wording</text>
  </g>

  <!-- Down Arrow 3 -->
  <line x1="380" y1="254" x2="380" y2="276" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Node 4: The Validator (Gatekeeper) -->
  <g transform="translate(220, 276)" filter="url(#box-shadow)">
    <rect x="0" y="0" width="320" height="54" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="160" y="24" fill="#e3b341" font-size="13.5" font-weight="800" text-anchor="middle">STRICT VALIDATOR GATE</text>
    <text x="160" y="42" fill="#8b949e" font-size="10" text-anchor="middle">Verifies entity-metric triples • Rejects ungrounded code claims</text>
  </g>

  <!-- Branching Arrows -->
  <path d="M 300 330 L 300 360 L 190 360 L 190 380" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <path d="M 460 330 L 460 360 L 570 360 L 570 380" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>

  <!-- Decision labels -->
  <g transform="translate(200, 348)">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#1f4b2c"/>
    <text x="30" y="14" fill="#7ee787" font-size="11" font-weight="700" text-anchor="middle">PASS</text>
  </g>
  <g transform="translate(500, 348)">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#491f24"/>
    <text x="30" y="14" fill="#ff7b72" font-size="11" font-weight="700" text-anchor="middle">FAIL</text>
  </g>

  <!-- Left Result: PASS -->
  <g transform="translate(70, 380)" filter="url(#box-shadow)">
    <rect x="0" y="0" width="240" height="74" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.8"/>
    <circle cx="28" cy="28" r="10" fill="#238636"/>
    <text x="28" y="32" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓</text>
    <text x="48" y="32" fill="#7ee787" font-size="13" font-weight="700">Verified Spoken Audio</text>
    <text x="16" y="56" fill="#c9d1d9" font-size="11">
      Synthesized by Kokoro-82M WASM.
    </text>
    <text x="16" y="69" fill="#8b949e" font-size="10">Playback marked "Verified (LLM)"</text>
  </g>

  <!-- Right Result: FAIL -->
  <g transform="translate(450, 380)" filter="url(#box-shadow)">
    <rect x="0" y="0" width="240" height="74" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.8"/>
    <circle cx="28" cy="28" r="10" fill="#da3633"/>
    <text x="28" y="32" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✕</text>
    <text x="48" y="32" fill="#ff7b72" font-size="13" font-weight="700">Faithful Safe Fallback</text>
    <text x="16" y="56" fill="#c9d1d9" font-size="11">
      Deterministic source-derived sentence.
    </text>
    <text x="16" y="69" fill="#8b949e" font-size="10">Candidate rejected. Playback continues uninterrupted.</text>
  </g>

  <!-- Hard Invariant Footer -->
  <text x="380" y="482" fill="#8b949e" font-size="11" font-weight="500" text-anchor="middle">
    Hard Architectural Invariant: Candidate text is NEVER passed through on validation failure.
  </text>
</svg>
